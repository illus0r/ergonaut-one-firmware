name: HRM diagnostic images
on:
  push:
    branches: [hrm-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - name: Build baseline and diagnostic images without flashing
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/hrm-build.log") 2>&1
          mkdir -p output
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
          west manifest --freeze > output/manifest-frozen.yml
          west build -s zmk/app -d build/base-left -b seeeduino_xiao_ble -- -DZMK_CONFIG="$GITHUB_WORKSPACE/config" -DSHIELD=ergonaut_one_left
          cp build/base-left/zephyr/zmk.uf2 output/left-baseline.uf2
          cp build/base-left/zephyr/.config output/left-baseline.config
          west build -s zmk/app -d build/base-right -b seeeduino_xiao_ble -- -DZMK_CONFIG="$GITHUB_WORKSPACE/config" -DSHIELD=ergonaut_one_right
          cp build/base-right/zephyr/zmk.uf2 output/right-baseline.uf2
          python3 diagnostics/instrument.py zmk
          git -C zmk diff > output/instrumentation.patch
          west build -s zmk/app -d build/diag-left -b seeeduino_xiao_ble -- -DZMK_CONFIG="$GITHUB_WORKSPACE/config" -DSHIELD=ergonaut_one_left -DEXTRA_CONF_FILE="$GITHUB_WORKSPACE/diagnostics/logging.conf"
          cp build/diag-left/zephyr/zmk.uf2 output/left-diagnostic.uf2
          cp build/diag-left/zephyr/.config output/left-diagnostic.config
          cp build/diag-left/zephyr/zephyr.dts output/left-diagnostic.dts
          if grep -q '^CONFIG_ZMK_SETTINGS_RESET_ON_START=y' output/*.config; then exit 1; fi
          python3 diagnostics/check_uf2.py output/*.uf2 > output/uf2-checks.json
          cp diagnostics/diagnose.py output/
      - name: Keep build log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrm-build-review
          path: |
            hrm-build.log
            output/
          retention-days: 30
